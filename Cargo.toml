[workspace]
members = ["crates/readability-core", "crates/readability-cli", "crates/readability-wasm", "crates/readability-python", "crates/readability-core/vendor/dom_smoothie"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/soulteary/readability-kit"
keywords = ["readability", "article", "html"]
categories = ["text-processing", "web-programming"]

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
