[package]
name = "readability-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Python bindings for the native readability-kit core"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# Exercise the extension through real Python processes, not a Rust harness
# linked against a platform-specific libpython.
test = false
doctest = false
bench = false

[dependencies]
readability-core = { path = "../readability-core" }
pyo3 = { version = "=0.29.0", features = ["abi3-py310"] }
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]
