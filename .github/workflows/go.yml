name: Go native compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/readability-kit
      - run: go build ./cmd/readability-kit-compat
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node tools/check-go-module.mjs
      - id: compare
        continue-on-error: true
        run: node tools/go-compatibility.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-compatibility
          path: go-reports/*.json
      - run: npx playwright install --with-deps chromium
      - name: Browser sanitizer reparse checks
        run: READABILITY_GO_COMPAT_BIN="$PWD/go-reports/readability-kit-compat" node tools/check-go-sanitizer.mjs
      - name: Strict release gate
        if: steps.compare.outcome != 'success'
        run: exit 1

  quality:
    name: Complete Go quality evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970 # v1.1.3
        with:
          directory: go
          version: v1.1.3
          threshold: '95.0'
          commit: 'false'
          output: go-reports/quality/goreportcard.svg
          report_output: go-reports/quality/goreportcard-report.md
      - name: Require all checkers and reject new findings
        run: |
          python3 -m unittest discover -s tests -p test_go_quality.py
          python3 tools/go-quality.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-quality
          path: go-reports/quality/
          if-no-files-found: error
