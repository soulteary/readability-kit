name: Rust WASM
on:
  push:
    paths: ['crates/**', 'Cargo.*', 'fuzz/**', 'packages/**', 'tools/**', 'tests/**', 'vendor/**', 'package.json', 'bun.lock', 'playwright.config.mjs', 'NOTICE', 'LICENSE*', 'LICENSES/**', 'UPSTREAM.md', 'PATCHES.md', 'upstream.json', 'docs/**', '.github/workflows/wasm.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'fuzz/**', 'packages/**', 'tools/**', 'tests/**', 'vendor/**', 'package.json', 'bun.lock', 'playwright.config.mjs', 'NOTICE', 'LICENSE*', 'LICENSES/**', 'UPSTREAM.md', 'PATCHES.md', 'upstream.json', 'docs/**', '.github/workflows/wasm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: npm --prefix packages/wasm run build
      - run: bun run test:package:wasm
      - run: WASM_EXTRA_BROWSERS=1 bun run test:wasm
      - run: READABILITY_WASM=1 node tools/check-rust-sanitizer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm-verification
          path: wasm-reports/
